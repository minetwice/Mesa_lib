name: Build Mesa PanVK + Zink for Android
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4
        with:
          ref: main-17061956483348987644

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add NDK and Local Binaries to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies & Upgrade Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex python3-mako pkg-config libdrm-dev python3-pip \
            llvm-dev clang libclang-dev spirv-tools spirv-headers libllvmspirvlib-18-dev llvm-spirv-18 \
            libexpat1-dev zlib1g-dev libzstd-dev
          pip3 install --user "meson>=1.4.0" ninja packaging pyyaml
          meson --version

      - name: Build Host Tools (mesa-clc & precomp-compiler)
        run: |
          meson setup build-host \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dplatforms= \
            -Dtools=panfrost \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            --prefix=/tmp/host-tools
          meson compile -C build-host
          meson install -C build-host
          echo "/tmp/host-tools/bin" >> $GITHUB_PATH

      - name: Create Android Cross File
        run: |
          cat << 'EOF' > android-aarch64.txt
          [binaries]
          c = 'aarch64-linux-android26-clang'
          cpp = 'aarch64-linux-android26-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = '/disable/non/android/system/pc/files'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      # NOTE: OSMesa was REMOVED upstream in Mesa 25.1 (gone in 26.2.3).
      # FearLauncher cannot get libOSMesa from this tree.
      # We build: PanVK ICD + Zink Gallium (Android).
      # Launcher should use EGL facade + load GL from libGL/libgallium, or gl4es fallback.
      - name: Configure Meson for Android ARM64
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$HOME/.local/bin:$PATH
          meson setup build-android \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=26 \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=zink \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dallow-fallback-for=libdrm \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          ninja -C build-android
          echo "✅ Compilation successful!"

      - name: Upload .so Files
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-mesa-panvk-zink-arm64
          path: |
            build-android/src/panfrost/vulkan/libvulkan_panfrost.so
            build-android/src/egl/libEGL_mesa.so
            build-android/src/gallium/targets/libgl-giga/libglapi.so
            build-android/src/gallium/targets/dri/libgallium_dri.so
            build-android/src/util/libmesa_util.so
          retention-days: 7
