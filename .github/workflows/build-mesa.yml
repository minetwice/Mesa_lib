name: Build Mesa PanVK for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake bison flex python3-mako pkg-config libdrm-dev llvm-dev clang libclang-dev spirv-tools python3-pip
          # Install Meson >= 1.4.0 (required by Mesa 26.2.3)
          pip install --upgrade meson>=1.4.0

      - name: Generate Cross File
        run: |
          mkdir -p .gitlab-ci/containers
          cat << 'EOF' > .gitlab-ci/containers/cross-android-aarch64.ini
          [binaries]
          ar = 'llvm-ar'
          c = ['aarch64-linux-android26-clang', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp = ['aarch64-linux-android26-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

      - name: Configure Meson for Android ARM64
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          meson setup build-android \
            --cross-file .gitlab-ci/containers/cross-android-aarch64.ini \
            -Dplatforms=android \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dllvm=enabled \
            -Dmesa-clc=disabled \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          ninja -C build-android
          echo "Compilation successful!"

      - name: Upload .so Files
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-mesa-panvk-arm64
          path: |
            build-android/src/panfrost/vulkan/libvulkan_panfrost.so
            build-android/src/util/libmesa_util.so
          retention-days: 7