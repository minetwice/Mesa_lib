name: Build Mesa PanVK + Zink for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4
        with:
          ref: main-17061956483348987644

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add NDK and Local Binaries to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies & Upgrade Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex python3-mako pkg-config libdrm-dev python3-pip \
            llvm-dev clang libclang-dev spirv-tools spirv-headers libllvmspirvlib-18-dev llvm-spirv-18 \
            libexpat1-dev zlib1g-dev libzstd-dev
          pip3 install --user "meson>=1.4.0" ninja packaging pyyaml
          meson --version

      - name: Build Host Tools (mesa-clc & precomp-compiler)
        run: |
          meson setup build-host \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dplatforms= \
            -Dtools=panfrost \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            --prefix=/tmp/host-tools
          meson compile -C build-host
          meson install -C build-host
          echo "/tmp/host-tools/bin" >> $GITHUB_PATH

      - name: Create Android Cross File
        run: |
          cat << 'EOF' > android-aarch64.txt
          [binaries]
          c = 'aarch64-linux-android26-clang'
          cpp = 'aarch64-linux-android26-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = '/disable/non/android/system/pc/files'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      # NOTE: OSMesa was REMOVED upstream in Mesa 25.1 (gone in 26.2.3).
      # FearLauncher cannot get libOSMesa from this tree.
      # We build: PanVK ICD + Zink/softpipe Gallium + desktop OpenGL + EGL (Android).
      # Launcher should use EGL facade + load GL from libGL/libgallium, or gl4es fallback.
      - name: Configure Meson for Android ARM64 (Zink + softpipe + PanVK)
        run: |
          meson setup build-android \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=26 \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=zink,softpipe \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dzstd=disabled \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          ninja -C build-android
          echo "Compile done"
          find build-android -name '*.so' | sort

      - name: Package artifacts
        run: |
          mkdir -p out/arm64
          # PanVK ICD
          find build-android -name 'libvulkan_panfrost.so' -exec cp -v {} out/arm64/ \;
          # Gallium / GL / EGL (names vary by meson version)
          for n in libGL.so libglapi.so libEGL.so libGLESv2.so libgallium_dri.so \
                   libgallium.so libOSMesa.so; do
            find build-android -name "$n" -exec cp -v {} out/arm64/ \; 2>/dev/null || true
          done
          # Also copy any lib*_gallium*.so
          find build-android -name 'lib*gallium*.so' -exec cp -v {} out/arm64/ \; 2>/dev/null || true
          ls -la out/arm64/
          # ICD json helper for Zink
          cat > out/arm64/panfrost_icd.json << 'ICD'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "libvulkan_panfrost.so",
              "api_version": "1.3"
            }
          }
          ICD
          (cd out && zip -r fear-launcher-mesa-panvk-zink-arm64.zip arm64)
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-mesa-panvk-zink-arm64
          path: out/fear-launcher-mesa-panvk-zink-arm64.zip
          if-no-files-found: warn
          retention-days: 14
