name: Build Mesa PanVK for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4
        with:
          ref: main-17061956483348987644 # Ye ensure karega ki wo tumhari patched branch use kare

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake bison flex python3-mako pkg-config libdrm-dev

      - name: Configure Meson for Android ARM64
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          meson setup build-android \
            --cross-file .gitlab-ci/containers/cross-android-aarch64.ini \
            -Dplatforms=android \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dllvm=disabled \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          ninja -C build-android
          echo "✅ Compilation successful!"

      - name: Upload .so Files
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-mesa-panvk-arm64
          path: |
            build-android/src/panfrost/vulkan/libvulkan_panfrost.so
            build-android/src/util/libmesa_util.so
          retention-days: 7
